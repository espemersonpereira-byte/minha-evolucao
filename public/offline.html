<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827 35%, #1f2937);
        color: white;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .box {
        max-width: 400px;
        padding: 32px 24px;
      }
      h1 { margin-bottom: 12px; }
      p { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Minha Evolução</h1>
      <p>Você está offline. Os dados locais do aplicativo continuarão disponíveis enquanto o dispositivo estiver sem conexão.</p>
    </div>
  </body>
</html>
